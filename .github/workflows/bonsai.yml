name: Git Bonsai

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grow Git Bonsai
        uses: egorthinks/git-bonsai@v1
        with:
          user: martybin
